<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login page</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header>
    <div class="header">
      <div class="logo">
        <i class="icon fa-solid fa-music"></i>
        <span>Musical</span>
      </div>
      <nav>
        <ul>
          <li><a href="../index.html">About Us</a></li>
          <li><a href="#">Music</a></li>
          <li><a href="#">Albums</a></li>
        </ul>
      </nav>
      <div class="button">
        <a href="login.html" class="btn-signin">Sign In</a>
        <a href="#" class="btn-signup">Sign Up</a>
      </div>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="login-card">
      <h2>Sign In</h2>
      <form action="#">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="admin@gmail.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password" required>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox"> Remember Me
          </label>
          <a href="#" class="forgot-pass">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit">LOGIN</button>

        <p class="register-link">
          Not a member? <a href="#">Register</a>
        </p>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <p>Musical Entertainment</p>
      <p class="copyright">Building Modern Websites - Set03</p>
    </div>
  </footer>

</body>
</html>
